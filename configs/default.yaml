# Default hyperparameter configuration.
#
# Every value can be overridden from the command line, e.g.
#   python scripts/train.py --config configs/default.yaml --n-splits 10

sampling_rate_hz: 512.0
n_splits: 5
random_state: 42

# Subject identifiers. These are string keys used both (a) as the file-name
# prefix for the NumPy arrays on disk (e.g. ``subject1_X_train.npy``) and
# (b) as keys into the per-subject pipeline declarations below. Remove
# entries from this list to restrict a run to a subset of subjects.
subjects: [subject1, subject2, subject3, subject4, subject5, subject6]

# Per-subject pipeline declarations. Each entry specifies the analysis
# window, frequency band, classifier family, and any family-specific
# hyperparameters. The selections below reproduce the results reported
# in the main README table.
per_subject:
  subject1:
    crop: [384, 1537]       # 2.25 s window
    band: [8, 13]           # mu band
    model: csp_svm_rbf
    n_components: 4
  subject2:
    crop: [384, 1537]
    band: [7, 30]
    model: eegnet           # best augmented configuration from the CV sweep
  subject3:
    crop: [256, 1537]       # 2.5 s window
    band: [6, 30]
    model: tangent_space_lr
  subject4:
    crop: [384, 1537]
    band: [6, 30]
    model: stacking_over_tangent_space
    base_bands:
      - [6, 30]
      - [8, 30]
      - [4, 40]
      - [8, 13]
      - [6, 14]
  subject5:
    crop: [256, 1537]
    band: [10, 14]
    model: csp_lda
    n_components: 4
  subject6:
    crop: [256, 1537]
    band: [10, 14]
    model: csp_lda
    n_components: 4
