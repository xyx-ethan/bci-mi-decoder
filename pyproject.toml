[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bci-mi-decoder"
version = "0.1.0"
description = "Per-subject adaptive ensemble for binary motor imagery classification from scalp EEG."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "BCI Motor Imagery Decoder contributors" }]
keywords = ["EEG", "BCI", "motor imagery", "CSP", "pyRiemann", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "mne>=1.6",
    "pyriemann>=0.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/your-username/bci-mi-decoder"
Issues = "https://github.com/your-username/bci-mi-decoder/issues"

[tool.setuptools.packages.find]
where = ["src"]
