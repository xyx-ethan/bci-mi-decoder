name: D17 Round31 one-shot List.all fix

on:
  push:
    branches:
      - d17-round31-modular-soundness-kernel-20260906
    paths:
      - .github/workflows/d17-round31-one-shot-fix.yml

permissions:
  contents: write

jobs:
  fix-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace unavailable Finset.all with finite List.all
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lean_d17/D17Round31ModularSoundness.lean')
          s = p.read_text()
          old = '(Finset.univ : Finset (ZMod m)).all fun x =>\n    decide (discZ m p q ≠ x ^ 2)'
          new = '(Finset.univ : Finset (ZMod m)).toList.all fun x =>\n    decide (discZ m p q ≠ x ^ 2)'
          assert old in s
          p.write_text(s.replace(old, new))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lean_d17/D17Round31ModularSoundness.lean
          git diff --cached --exit-code && exit 1 || true
          git commit -m "D17 round31: use finite List.all for modular filter"
          git push
