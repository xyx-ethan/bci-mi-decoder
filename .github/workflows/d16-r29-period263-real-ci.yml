name: D16 R29 period263 real kernel gate

on:
  push:
    branches:
      - d16-r29-period263-real-ci

permissions:
  contents: read

jobs:
  kernel-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Clone pinned Formal Conjectures
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/google-deepmind/formal-conjectures.git fc
          cd fc
          git checkout 8323e878b83fcd7f4a448256069352a265460d75
          test "$(git rev-parse HEAD)" = "8323e878b83fcd7f4a448256069352a265460d75"
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.33.1"
          grep -q '0df444a360eaa60ab8c11dca51a86af692955474' lake-manifest.json
          sha256sum FormalConjectures/OEIS/67720.lean lean-toolchain lake-manifest.json

      - name: Inject pinned D16 R29 certificate
        run: |
          set -euxo pipefail
          cd fc
          mkdir -p FormalConjectures/Research
          curl -fsSL https://raw.githubusercontent.com/xyx-ethan/bci-mi-decoder/917ab5d39164a46af5706028fba90f04e43007cd/research/D16R29Period263.lean \
            -o FormalConjectures/Research/D16R29Period263.lean
          sha256sum FormalConjectures/Research/D16R29Period263.lean
          ! grep -E '\b(sorry|admit|native_decide)\b|^\s*(axiom|unsafe)\b|Lean\.ofReduceBool|Lean\.trustCompiler' FormalConjectures/Research/D16R29Period263.lean

      - name: Install elan exactly as upstream
        run: |
          set -euxo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned mathlib olean cache
        run: |
          set -euxo pipefail
          cd fc
          lean --version
          lake --version
          lake exe cache get

      - name: Focused kernel compile
        run: |
          set -euxo pipefail
          cd fc
          set -o pipefail
          lake env lean FormalConjectures/Research/D16R29Period263.lean 2>&1 | tee /tmp/d16_r29_focus.log
          echo D16_R29_FOCUSED_KERNEL_PASS

      - name: Generate aggregate files
        run: |
          set -euxo pipefail
          cd fc
          ./scripts/mk_all_formathlib.sh
          rm -f FormalConjectures/All.lean
          lake exe mk_all --lib FormalConjectures || true
          mv FormalConjectures.lean FormalConjectures/All.lean
          echo "set_option linter.style.moduleDocstring false" >> FormalConjectures/All.lean

      - name: Full warning-free project build
        run: |
          set -euxo pipefail
          cd fc
          set -o pipefail
          lake --wfail build 2>&1 | tee /tmp/d16_r29_lake_wfail_build.log
          echo D16_R29_LAKE_WFAIL_BUILD_PASS

      - name: Kernel axiom audit
        run: |
          set -euxo pipefail
          cd fc
          cat > AuditD16R29.lean <<'LEAN'
          import FormalConjectures.Research.D16R29Period263
          #print axioms D16R29Period263.cast_step
          #print axioms D16R29Period263.cast_iterate
          #print axioms D16R29Period263.period_131
          #print axioms D16R29Period263.zero_104
          #print axioms D16R29Period263.period_mul
          #print axioms D16R29Period263.zero_progression
          #print axioms D16R29Period263.dvd_progression
          #print axioms D16R29Period263.pN_succ_lt
          #print axioms D16R29Period263.pN_monotone
          #print axioms D16R29Period263.pN_two
          #print axioms D16R29Period263.proper_divisor_progression
          #print axioms D16R29Period263.not_prime_progression
          LEAN
          set -o pipefail
          lake env lean AuditD16R29.lean 2>&1 | tee /tmp/d16_r29_axioms.log
          ! grep -E 'sorryAx|native_decide\.ax|Lean\.ofReduceBool|Lean\.trustCompiler' /tmp/d16_r29_axioms.log
          echo D16_R29_AXIOM_AUDIT_PASS
