name: D17 Round30 generate full survivor certificates

on:
  push:
    branches:
      - d17-round30-survivor-gaps-kernel-20260906
    paths:
      - lean_d17/generate_round30.py
      - .github/workflows/d17-round30-generate-full.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the 22 terminal gap theorems
        working-directory: lean_d17
        run: python3 generate_round30.py
      - name: Commit generated Lean source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lean_d17/D17Round30SurvivorGaps.lean
          git diff --cached --exit-code && exit 1 || true
          git commit -m "D17 round30: generate all 22 kernel gap certificates"
          git push
