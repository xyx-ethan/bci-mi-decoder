name: D13 R12 general encoding and critical factor audit
on:
  push:
    branches: [research/d13-r12-kernel]
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install verified pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          mkdir "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP/lean" --strip-components=1
          rm "$RUNNER_TEMP/lean.tar.zst"
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/d13-fc"
          git -C "$RUNNER_TEMP/d13-fc" remote add origin https://github.com/google-deepmind/formal-conjectures.git
          git -C "$RUNNER_TEMP/d13-fc" fetch --depth 1 origin 8323e878b83fcd7f4a448256069352a265460d75
          git -C "$RUNNER_TEMP/d13-fc" checkout --detach FETCH_HEAD
      - name: Rebuild parent and verify general two-prime interface
        shell: bash
        run: |
          set -euo pipefail
          unset LEAN_PATH LEAN_SRC_PATH
          python3 -u d13_r12/verify.py "$RUNNER_TEMP/d13-fc"
      - name: Preserve kernel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d13-r12-kernel-evidence
          retention-days: 30
          path: d13_r12/evidence/
  critical-factors:
    if: github.run_number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install GMP-ECM
        run: sudo apt-get update -qq && sudo apt-get install -y gmp-ecm
      - name: Execute bounded deterministic curves
        run: python3 -u d13_r12/factor_probe.py
      - name: Preserve complete and partial curve logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d13-r12-factor-evidence
          retention-days: 30
          path: factor_evidence/
