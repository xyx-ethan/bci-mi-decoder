name: D13 R10 new-factor kernel audit
on:
  push:
    branches: [research/d13-r10-kernel]
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned verified Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          mkdir "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP/lean" --strip-components=1
          rm "$RUNNER_TEMP/lean.tar.zst"
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - name: Fetch exact upstream dependency pins
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/d13-fc"
          git -C "$RUNNER_TEMP/d13-fc" remote add origin https://github.com/google-deepmind/formal-conjectures.git
          git -C "$RUNNER_TEMP/d13-fc" fetch --depth 1 origin 8323e878b83fcd7f4a448256069352a265460d75
          git -C "$RUNNER_TEMP/d13-fc" checkout --detach FETCH_HEAD
      - name: Rebuild 104 classes and verify 12 new factor classes
        run: |
          set -euo pipefail
          unset LEAN_PATH LEAN_SRC_PATH
          python3 -u d13_r10/build.py "$RUNNER_TEMP/d13-fc"
      - name: Save kernel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d13-r10-kernel-evidence
          retention-days: 30
          path: d13_r10/evidence/
  critical-factors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install GMP-ECM
        run: sudo apt-get update -qq && sudo apt-get install -y gmp-ecm
      - name: Bounded factorization probes
        shell: bash
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          from pathlib import Path
          Path('evidence/q1.txt').write_text(str((740*10**733+1)//2391)+'\n')
          Path('evidence/q2.txt').write_text(str((370*10**666+1)//2177)+'\n')
          PY
          ecm -h > evidence/help.txt 2>&1 || true
          set +e
          timeout 240 ecm -c 128 100000 10000000 < evidence/q1.txt > evidence/q1.log 2>&1
          echo "$?" > evidence/q1.exit
          timeout 240 ecm -c 128 100000 10000000 < evidence/q2.txt > evidence/q2.log 2>&1
          echo "$?" > evidence/q2.exit
          sha256sum evidence/* > evidence/SHA256SUMS
      - name: Save factorization logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d13-r10-factor-probes
          retention-days: 30
          path: evidence/
