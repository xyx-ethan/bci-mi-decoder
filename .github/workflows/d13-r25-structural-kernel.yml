name: D13 R25 structural kernel certificate

on:
  push:
    branches:
      - research/d13-r25-structural-kernel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Generate the canonical 21,098-row certificate
        working-directory: lean_d13r25
        run: |
          set -euo pipefail
          python3 generate_certificate.py | tee generation.log
          test -s elimination_certificate.csv
          test -s candidate_tuples.csv
          test -s manifest.json
          echo "0c2b2379998208e6bae2893593a3735734eadeead8fd17183ecd98f1bdf6ff10  elimination_certificate.csv" | sha256sum -c -
          echo "5a78ef72f26ebe5d8e91f3fdb7d430f5a6ed4879ce5e7a52620603e4347eae65  candidate_tuples.csv" | sha256sum -c -

      - name: Run two independent exact checkers
        working-directory: lean_d13r25
        run: |
          set -euo pipefail
          python3 verify_python.py | tee python_check.log
          g++ -std=c++17 -O2 -Wall -Wextra -Werror verify_cpp.cpp -o verify_cpp
          ./verify_cpp elimination_certificate.csv | tee cpp_check.log

      - name: Install verified Lean 4.33.1
        run: |
          set -euo pipefail
          curl -fL --retry 2 https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          mkdir "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP/lean" --strip-components=1
          rm "$RUNNER_TEMP/lean.tar.zst"
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"

      - name: Verify pinned toolchain
        run: |
          lean --version
          lake --version

      - name: Resolve pinned dependencies
        working-directory: lean_d13r25
        run: |
          set -euo pipefail
          lake update
          lake exe cache get

      - name: Exact strict Lake build
        working-directory: lean_d13r25
        run: |
          set -o pipefail
          lake --wfail build 2>&1 | tee lake_wfail_build.log

      - name: Print and audit every final theorem dependency
        working-directory: lean_d13r25
        run: |
          set -o pipefail
          lake env lean AxiomAudit.lean 2>&1 | tee axiom_audit.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('axiom_audit.log').read_text()
          names = [line.split()[-1] for line in Path('AxiomAudit.lean').read_text().splitlines() if line.startswith('#print axioms ')]
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          assert len(names) == 8
          for name in names:
              m = re.search(r"'" + re.escape(name) + r"' depends on axioms:\s*\[([^\]]*)\]", text, re.S)
              z = re.search(r"'" + re.escape(name) + r"' does not depend on any axioms", text)
              assert bool(m) ^ bool(z), (name, bool(m), bool(z))
              deps = set() if z else {x.strip() for x in m.group(1).split(',') if x.strip()}
              assert deps <= allowed, (name, deps)
          print('AXIOM_AUDIT_PASS theorems=8 allowed=' + ','.join(sorted(allowed)))
          PY
          if grep -E 'sorryAx|native_decide\.ax|Lean\.ofReduceBool|Lean\.trustCompiler' axiom_audit.log; then
            echo 'forbidden dependency detected'
            exit 1
          fi

      - name: Reject forbidden source constructs
        run: |
          set -euo pipefail
          if grep -n -E '\b(sorry|admit|unsafe|native_decide)\b|Lean\.ofReduceBool|Lean\.trustCompiler|^axiom\b' \
              lean_d13r25/D13StructuralKernel.lean lean_d13r25/AxiomAudit.lean; then
            echo 'forbidden Lean source construct detected'
            exit 1
          fi

      - name: Freeze evidence and hashes
        working-directory: lean_d13r25
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp D13StructuralKernel.lean AxiomAudit.lean \
             elimination_certificate.csv candidate_tuples.csv manifest.json \
             generate_certificate.py verify_python.py verify_cpp.cpp \
             generation.log python_check.log cpp_check.log \
             lake_wfail_build.log axiom_audit.log \
             lakefile.toml lean-toolchain evidence/
          (cd evidence && sha256sum * > SHA256SUMS)
          cat evidence/SHA256SUMS

      - name: Preserve exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d13-r25-structural-kernel-evidence
          retention-days: 30
          path: lean_d13r25/evidence/
