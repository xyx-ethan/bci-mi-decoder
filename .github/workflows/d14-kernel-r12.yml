name: D14 R12 pinned kernel audit
on:
  push:
    branches: [research/d14-r12-kernel]
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Lean 4.33.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst -o "$RUNNER_TEMP/lean.tar.zst"
          echo "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          mkdir "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP/lean" --strip-components=1
          rm "$RUNNER_TEMP/lean.tar.zst"
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - name: Get exact upstream commit
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/d14-fc"
          git -C "$RUNNER_TEMP/d14-fc" remote add origin https://github.com/google-deepmind/formal-conjectures.git
          git -C "$RUNNER_TEMP/d14-fc" fetch --depth 1 origin 8323e878b83fcd7f4a448256069352a265460d75
          git -C "$RUNNER_TEMP/d14-fc" checkout --detach FETCH_HEAD
      - name: Compile sources and audit actual axioms
        shell: bash
        run: |
          set -euo pipefail
          unset LEAN_PATH LEAN_SRC_PATH
          python3 -u d14_r12/build.py "$RUNNER_TEMP/d14-fc"
      - name: Upload source, object and log evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d14-r12-kernel-evidence
          if-no-files-found: warn
          retention-days: 30
          path: d14_r12/evidence/
