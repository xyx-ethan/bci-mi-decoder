name: D14 Round11 kernel audit

on:
  push:
    branches:
      - d14-round11-kernel-audit-20260905
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install elan and pinned Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: |
          lean --version
          lake --version

      - name: Resolve pinned dependencies
        working-directory: lean_d14
        run: |
          lake update
          lake exe cache get

      - name: Exact required strict build
        working-directory: lean_d14
        run: lake --wfail build

      - name: Print and reject forbidden axioms
        working-directory: lean_d14
        run: |
          set -o pipefail
          lake env lean AxiomAudit.lean | tee axiom-audit.log
          if grep -E 'sorryAx|Lean\.ofReduceBool|Lean\.trustCompiler' axiom-audit.log; then
            echo 'forbidden axiom detected'
            exit 1
          fi

      - name: Reject forbidden source constructs
        run: |
          for f in lean_d14/D14Witness.lean lean_d14/AxiomAudit.lean; do
            if grep -n -E '\b(sorry|admit|axiom|unsafe|native_decide)\b' "$f"; then
              echo "forbidden Lean source token detected in $f"
              exit 1
            fi
          done

      - name: Record pinned dependency revisions
        working-directory: lean_d14
        run: |
          grep -A12 -B2 'formal_conjectures' lake-manifest.json || true
          grep -A12 -B2 'mathlib' lake-manifest.json || true
