name: D16 R30 period4377409 full kernel gate

on:
  push:
    branches:
      - d16-r30-period4377409-ci

permissions:
  contents: read

jobs:
  kernel-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Clone pinned Formal Conjectures
        run: |
          set -euxo pipefail
          git clone --filter=blob:none https://github.com/google-deepmind/formal-conjectures.git fc
          cd fc
          git checkout 8323e878b83fcd7f4a448256069352a265460d75
          test "$(git rev-parse HEAD)" = "8323e878b83fcd7f4a448256069352a265460d75"
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.33.1"
          grep -q '0df444a360eaa60ab8c11dca51a86af692955474' lake-manifest.json
          sha256sum FormalConjectures/OEIS/67720.lean lean-toolchain lake-manifest.json

      - name: Inject exact R30 source
        run: |
          set -euxo pipefail
          cd fc
          mkdir -p FormalConjectures/Research
          curl -fsSL https://raw.githubusercontent.com/xyx-ethan/bci-mi-decoder/9cf6f0b16ca171992ad7984ac3219fa9c9afdcde/research/D16R30Period4377409.lean \
            -o FormalConjectures/Research/D16R30Period4377409.lean
          echo 'Expected source SHA-256: 90f7bc7a28d2221b11ac95bae303d3a229487aa6be4c635a509143b06d6445aa'
          echo '90f7bc7a28d2221b11ac95bae303d3a229487aa6be4c635a509143b06d6445aa  FormalConjectures/Research/D16R30Period4377409.lean' | sha256sum -c -
          ! grep -E '\b(sorry|admit|native_decide)\b|^\s*(axiom|unsafe)\b|Lean\.ofReduceBool|Lean\.trustCompiler' FormalConjectures/Research/D16R30Period4377409.lean

      - name: Install elan exactly as upstream
        run: |
          set -euxo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned mathlib olean cache
        run: |
          set -euxo pipefail
          cd fc
          lean --version
          lake --version
          lake exe cache get

      - name: Focused kernel compile
        run: |
          set -euxo pipefail
          cd fc
          set -o pipefail
          lake env lean FormalConjectures/Research/D16R30Period4377409.lean 2>&1 | tee /tmp/d16_r30_focused.log
          echo D16_R30_FOCUSED_KERNEL_PASS

      - name: Generate aggregate files
        run: |
          set -euxo pipefail
          cd fc
          ./scripts/mk_all_formathlib.sh
          rm -f FormalConjectures/All.lean
          lake exe mk_all --lib FormalConjectures || true
          mv FormalConjectures.lean FormalConjectures/All.lean
          echo "set_option linter.style.moduleDocstring false" >> FormalConjectures/All.lean

      - name: Full warning-free project build
        run: |
          set -euxo pipefail
          cd fc
          set -o pipefail
          lake --wfail build 2>&1 | tee /tmp/d16_r30_lake_wfail_build.log
          echo D16_R30_LAKE_WFAIL_BUILD_PASS

      - name: Kernel axiom audit
        run: |
          set -euxo pipefail
          cd fc
          cat > AuditD16R30.lean <<'LEAN'
          import FormalConjectures.Research.D16R30Period4377409
          #print axioms D16R30Period4377409.s_sq
          #print axioms D16R30Period4377409.u_period
          #print axioms D16R30Period4377409.v_period
          #print axioms D16R30Period4377409.stepZ_period
          #print axioms D16R30Period4377409.zero_at_112
          #print axioms D16R30Period4377409.dvd_progression
          #print axioms D16R30Period4377409.p112_eval
          #print axioms D16R30Period4377409.not_prime_progression
          #check D16R30Period4377409.not_prime_progression
          LEAN
          set -o pipefail
          lake env lean AuditD16R30.lean 2>&1 | tee /tmp/d16_r30_axioms.log
          ! grep -E 'sorryAx|native_decide\.ax|Lean\.ofReduceBool|Lean\.trustCompiler' /tmp/d16_r30_axioms.log
          echo D16_R30_AXIOM_AUDIT_PASS
