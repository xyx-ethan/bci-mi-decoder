name: Lean A067599 verification

on:
  push:
    branches:
      - formal-conjectures-a067599-ci
  workflow_dispatch:

concurrency:
  group: lean-a067599-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out temporary verification branch
        uses: actions/checkout@v4

      - name: Clone pinned Formal Conjectures snapshot
        run: |
          git clone https://github.com/google-deepmind/formal-conjectures.git fc
          git -C fc checkout 1b567c2f96e2aa86328094c4b9ca57f72a0d886e
          git -C fc rev-parse HEAD | tee fc-head.log

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install pinned toolchain and Mathlib cache
        run: |
          set -o pipefail
          cd fc
          lake --version 2>&1 | tee ../toolchain.log
          lake exe cache get 2>&1 | tee ../cache.log

      - name: Reject prohibited proof escapes
        run: |
          if grep -nE '(^|[^[:alnum:]_])(sorry|axiom|unsafe)([^[:alnum:]_]|$)' ci/A067599ExactProgress.lean; then
            echo 'Prohibited token found in proof source.'
            exit 1
          fi

      - name: Install proof as a library module
        run: |
          cp ci/A067599ExactProgress.lean fc/FormalConjectures/OEIS/A067599PrimePower.lean

      - name: Build modified target with warnings fatal
        run: |
          set -o pipefail
          cd fc
          lake --wfail build FormalConjectures.OEIS.A067599PrimePower 2>&1 | tee ../target-build.log

      - name: Record proof axioms
        run: |
          cat > fc/A067599Axioms.lean <<'EOF'
          import FormalConjectures.OEIS.A067599PrimePower
          #print axioms OeisA67599.no_prime_power_fixed_point
          EOF
          cd fc
          lake env lean A067599Axioms.lean 2>&1 | tee ../axioms.log

      - name: Record source diff
        run: |
          cd fc
          git diff --no-index /dev/null FormalConjectures/OEIS/A067599PrimePower.lean > ../a067599.patch || test $? -eq 1

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a067599-lean-logs
          path: |
            fc-head.log
            toolchain.log
            cache.log
            target-build.log
            axioms.log
            a067599.patch
          if-no-files-found: ignore
